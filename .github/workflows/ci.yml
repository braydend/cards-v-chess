name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. The deploy job widens this for itself only.
permissions:
  contents: read

concurrency:
  # Superseded pull-request runs should be abandoned. main is exempt: a
  # cancelled run would kill an in-flight Pages deploy, which can leave the
  # site half-updated. Job-level concurrency cannot express this, because
  # workflow-level cancellation outranks it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # The balance gate is advisory (issue #72) and runs in its own job below.
    # The coverage run here excludes it so a gate failure never blocks the
    # merge gate; src/balance coverage is measured against the unit tests
    # alone, which is what the thresholds in vite.config.ts track. The gate
    # itself takes ~70s under coverage, so excluding it also keeps this job
    # well inside its budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: the pnpm cache below needs the pnpm binary to
      # resolve the store path. Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Four separate steps rather than one chained command, so a failure is
      # labelled with which check failed. They total ~4s; the cost is noise.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage --exclude src/balance/balance.test.ts

      - name: Build
        run: pnpm build

      # Only main deploys, so only main pays for the artifact.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The power-balance gate (issue #72). Advisory, not a merge gate: it exists
  # to measure the game's balance and surface drift, and its thresholds are a
  # ratchet still being tuned — so a failure must never block. continue-on-error
  # keeps the job visible (its report prints) without failing the workflow.
  balance:
    name: balance (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Balance gate
        run: pnpm test:run src/balance/balance.test.ts --reporter=verbose

  deploy:
    name: deploy
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      # Killing an in-flight Pages deploy can leave the site half-updated, so
      # these queue rather than cancel. Matches GitHub's own Pages template.
      group: pages
      cancel-in-progress: false

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
